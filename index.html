<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFT-Críptico</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🟨%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat+Brush&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header>
    <div class="hero-note"><h1 id="titulo">GFT-Críptico</h1></div>
    <p class="subtitle" id="subtitulo"></p>
    <nav class="nav" aria-label="Secciones">
      <a href="index.html" aria-current="page">Pista y clasificación</a>
      <a href="reglas.html">Reglas</a>
    </nav>
  </header>

  <main>
    <section class="clue" id="clue" hidden aria-labelledby="h-clue">
      <div class="label">
        <h2 id="h-clue">Pista del día</h2>
        <time id="clue-date"></time>
      </div>
      <p class="clue-text" id="clue-text"></p>
      <p class="clue-note">Cualquiera puede pensarla, esté o no en la oficina. ¿No sabes cómo funciona? Mira <a href="reglas.html">las reglas</a>.</p>
    </section>

    <section class="board" aria-labelledby="h-board">
      <h2 id="h-board">Clasificación</h2>
      <ol class="rows" id="rows"></ol>
      <p class="meta" id="meta"></p>
    </section>
  </main>
  <noscript>Esta página necesita JavaScript para mostrar la clasificación.</noscript>
</div>

<script src="data.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  $("titulo").textContent = CONFIG.titulo;
  $("subtitulo").textContent = CONFIG.subtitulo;
  document.title = CONFIG.titulo;

  // Total por persona; orden por puntos y después alfabético
  const players = Object.entries(PUNTUACIONES).map(([name, pts]) => ({
    name,
    pts: DIAS.map((_, i) => Math.trunc(Number(pts[i])) || 0),
  }));
  players.forEach((p) => { p.total = p.pts.reduce((a, b) => a + b, 0); });
  players.sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, "es"));

  const rows = $("rows");
  if (!players.length) {
    rows.replaceWith(el("p", "empty", "Todavía no hay nadie. Añade jugadores en data.js."));
  }
  const SHOWN_DAYS = 5;
  const parse = (iso) => new Date(iso + "T12:00:00");
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const dow = (iso) => cap(parse(iso).toLocaleDateString("es-ES", { weekday: "short" }).replace(".", ""));
  const full = (iso) => parse(iso).toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
  players.forEach((p, i) => {
    // Empates: mismo puesto
    p.rank = i > 0 && p.total === players[i - 1].total ? players[i - 1].rank : i + 1;

    const li = el("li", "row" + (p.rank <= 3 ? " r" + p.rank : ""));
    li.appendChild(el("div", "rank", p.rank));

    const mid = el("div");
    mid.appendChild(el("div", "name", p.name));
    const days = el("div", "days");
    const start = Math.max(0, DIAS.length - SHOWN_DAYS);
    p.pts.slice(start).forEach((v, k) => {
      const d = el("div", "day");
      const c = el("span", "chip" + (v > 0 ? " hit" : v < 0 ? " pen" : ""), v > 0 ? "✓" : v < 0 ? "−" + Math.abs(v) : "–");
      c.title = full(DIAS[start + k]) + (v > 0 ? ": acertó" : v < 0 ? ": penalizado por trampas" : ": no acertó");
      d.appendChild(c);
      d.appendChild(el("span", "dow", dow(DIAS[start + k])));
      days.appendChild(d);
    });
    mid.appendChild(days);
    li.appendChild(mid);

    const tot = el("div", "total", p.total < 0 ? "−" + Math.abs(p.total) : p.total);
    tot.appendChild(el("small", "", p.total === 1 ? "punto" : "puntos"));
    li.appendChild(tot);
    rows.appendChild(li);
  });

  $("meta").textContent = DIAS.length
    ? "Última actualización: " + full(DIAS[DIAS.length - 1]) + ". Se muestran los últimos 5 días (✓ = acertó, −1 = penalizado por trampas)."
    : "";

  // Pista del día (se oculta si no hay texto)
  if (typeof PISTA !== "undefined" && PISTA && PISTA.texto) {
    const ENUM = /\s*(\(\s*\d+(?:\s*,\s*\d+)*\s*\))\s*$/;
    const m = PISTA.texto.match(ENUM);
    const p = $("clue-text");
    p.appendChild(document.createTextNode(m ? PISTA.texto.replace(ENUM, "") : PISTA.texto));
    if (m) p.appendChild(el("span", "enum", m[1].replace(/\s+/g, "")));
    if (PISTA.fecha) {
      $("clue-date").textContent = full(PISTA.fecha);
      $("clue-date").setAttribute("datetime", PISTA.fecha);
    }
    $("clue").hidden = false;
  }
</script>
</body>
</html>
